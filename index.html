<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kasse unterwegs</title><meta name="theme-color" content="#0f6b5c">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--c:#0f6b5c;--bg:#f3f7f6;--tx:#1d2927;--mu:#5d6f6b;--ln:#d7e2df;--ein:#0f6b5c;--aus:#a33a2a}
@media (prefers-color-scheme:dark){:root{--bg:#141b1a;--tx:#e7f0ee;--mu:#9bb0ab;--ln:#2d3d3a;--ein:#5fd0b8;--aus:#ff9a88}.card,input,select,textarea,.sheet{background:#1e2927!important;color:var(--tx)!important}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
header{background:var(--c);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1;line-height:1.2}header small{display:block;font-weight:400;opacity:.85;font-size:12px}
.lang button{background:transparent;color:#fff;border:1px solid #fff8;border-radius:8px;padding:6px 9px;font-size:13px}.lang button.on{background:#fff;color:var(--c);font-weight:700}
main{padding:12px 16px;max-width:760px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;border:0;background:transparent;color:var(--mu);padding:12px 4px;font-size:15px;min-height:56px}nav button.on{color:var(--c);font-weight:700;border-top:3px solid var(--c)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
input,select,textarea{font:inherit;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:#fff;width:100%;min-height:46px}
textarea{min-height:70px}label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
.btn{background:var(--c);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:600;min-height:46px}.btn.alt{background:#0000;color:var(--c);border:1px solid var(--c)}.btn.s{padding:8px 12px;min-height:40px;font-size:15px}.btn.del{background:#0000;color:var(--aus);border:1px solid var(--aus)}
.chips{display:flex;gap:6px;margin:8px 0}.chips button{flex:1;border:1px solid var(--ln);background:#0000;color:var(--tx);border-radius:10px;padding:9px 0;font:inherit;font-size:15px}.chips button.on{background:var(--c);color:#fff;border-color:var(--c)}
.card{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:11px 12px;margin:8px 0;display:flex;gap:10px;align-items:flex-start}
.card .l{flex:1;min-width:0}.card .r{text-align:right;white-space:nowrap}.card b{font-size:17px}.mu{color:var(--mu);font-size:14px}
.ein{color:var(--ein);font-weight:700}.aus{color:var(--aus);font-weight:700}
.tag{display:inline-block;background:#0f6b5c18;color:var(--c);border-radius:6px;padding:1px 7px;font-size:12px;margin-left:4px}.tag.w{background:#c9820022;color:#a86a00}
.sum{background:#0f6b5c10;border-left:4px solid var(--c);padding:10px 12px;border-radius:6px;margin:8px 0;font-size:15px}
.half{display:flex;gap:8px}.half>*{flex:1;min-width:0}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:5px 0;border-bottom:1px solid var(--ln)}td.n{text-align:right;white-space:nowrap}
#ov{position:fixed;inset:0;background:#0007;z-index:10;display:none;overflow:auto}.sheet{background:var(--bg);margin:0 auto;max-width:760px;min-height:100%;padding:16px 16px 40px}
#toast{position:fixed;left:16px;right:16px;bottom:78px;background:#222;color:#fff;border-radius:10px;padding:12px 14px;z-index:20;display:none}#toast.err{background:#a02020}
.art{display:flex;gap:8px}.art button{flex:1;padding:13px 0;border:2px solid var(--ln);border-radius:10px;background:#0000;color:var(--tx);font:inherit;font-weight:600}.art button.on.a{background:var(--aus);border-color:var(--aus);color:#fff}.art button.on.e{background:var(--ein);border-color:var(--ein);color:#fff}
.foto{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#0001;margin-top:8px}
</style></head><body>
<header><h1>Kasse unterwegs<small id="hs"></small></h1><div class="lang" id="lg"></div></header>
<main id="m"></main><nav id="nv"></nav><div id="ov"></div><div id="toast"></div>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});var had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload();had=true;});});</script>
</body></html>
